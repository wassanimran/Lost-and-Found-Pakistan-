<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Lost Item</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h2>Lost &amp; <span>Found</span></h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="lost-items.html">Lost</a>
        <a href="found-items.html">Found</a>
        <a href="report-lost.html">Report Lost</a>
        <a href="report-found.html">Report Found</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="section form-section">
    <h1>Report a Lost Item</h1>
    <p id="authStatus" class="auth-status">Please sign in before submitting a lost item report.</p>
    <form class="report-form firebase-form" data-report-type="lost" novalidate>
        <label>Item Name<input name="itemName" placeholder="e.g., Black wallet" required></label>
        <label>Category
            <select name="category" required>
                <option value="">Select category</option>
                <option>Wallet</option><option>Phone</option><option>Bag</option><option>Documents</option><option>Keys</option><option>Electronics</option><option>Other</option>
            </select>
        </label>
        <label>Lost Date<input type="date" name="date" required></label>
        <label>Last Seen Location<input name="location" placeholder="City, campus, station, street" required></label>
        <label>Contact Number<input name="contact" placeholder="Phone or WhatsApp" required></label>
        <label>Details<textarea name="details" maxlength="600" placeholder="Describe color, marks, brand, or other identifying details" required></textarea></label>
        <button class="btn btn-primary" type="submit">Submit Lost Report</button>
    </form>
</section>

<footer>© 2026 Lost &amp; Found Pakistan</footer>
<script type="module" src="main.js"></script>
</body>
</html>
