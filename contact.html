<section class="section form-section contact-section">
    <h1>Contact Us</h1>
    <p>Send a message to the Lost &amp; Found Pakistan team. Messages are stored in Firebase Firestore.</p>
    <form class="contact-form firebase-form" novalidate>
        <label>Name<input name="name" required autocomplete="name"></label>
        <label>Email<input type="email" name="email" required autocomplete="email"></label>
        <label>Subject<input name="subject" required></label>
        <label>Message<textarea name="message" maxlength="800" required></textarea></label>
        <button class="btn btn-primary" type="submit">Send Message</button>
    </form>
</section>

<footer>© 2026 Lost &amp; Found Pakistan</footer>
